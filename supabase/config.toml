# Supabase CLI config for local development (`npm run db:start`).
# Production project: vuclwradmphgasiactsa (eu-central-2).
project_id = "maillot"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4733"]
enable_signup = true

[auth.email]
enable_confirmations = false

# Branded, localised auth emails (language from the sign-up's user metadata).
# Production: paste the same subject and file content under Authentication →
# Emails in the Supabase dashboard (see README → Auth emails).
[auth.email.template.confirmation]
subject = '{{ if eq (or .Data.lang "en") "de" }}MAILLOT: Bestätige deine E-Mail-Adresse{{ else if eq (or .Data.lang "en") "fr" }}MAILLOT : confirme ton adresse e-mail{{ else }}MAILLOT: Confirm your email{{ end }}'
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = '{{ if eq (or .Data.lang "en") "de" }}MAILLOT: Neues Passwort wählen{{ else if eq (or .Data.lang "en") "fr" }}MAILLOT : choisis un nouveau mot de passe{{ else }}MAILLOT: Choose a new password{{ end }}'
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = '{{ if eq (or .Data.lang "en") "de" }}MAILLOT: Bestätige deine neue E-Mail-Adresse{{ else if eq (or .Data.lang "en") "fr" }}MAILLOT : confirme ta nouvelle adresse{{ else }}MAILLOT: Confirm your new email{{ end }}'
content_path = "./supabase/templates/email_change.html"

# Admin rights require a TOTP second factor (is_admin() checks aal2).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Per-IP limits on the auth endpoints (per 5 minutes).
[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30

# Bot protection on sign-up/sign-in: off locally; in production enable
# Cloudflare Turnstile under Auth → Bot and Abuse Protection and set
# VITE_TURNSTILE_SITE_KEY for the app.
[auth.captcha]
enabled = false
provider = "turnstile"

# Edge functions. verify_jwt = false only where the function authenticates
# callers itself (Stripe signature, API key, or id-only internal relay).
[functions.checkout]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.send-notification]
verify_jwt = false

[functions.price-index]
verify_jwt = false

[functions.settle]
verify_jwt = false

[functions.connect-onboarding]
verify_jwt = true

[functions.shipping-label]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.identify-shirt]
verify_jwt = true

[functions.fetch-comps]
verify_jwt = false

[functions.wallet-pass]
verify_jwt = false
