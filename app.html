<!doctype html>
<html lang="en" data-first-load>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Capture your football shirt collection, see what it’s worth and show it anywhere." />
    <meta property="og:site_name" content="Maillot" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Maillot" />
    <meta property="og:description" content="Capture your football shirt collection, see what it’s worth and show it anywhere." />
    <meta property="og:image" content="/og/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Maillot — your football shirt collection, always with you" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Maillot — your football shirt collection, always with you</title>
    <!-- Prerendered pages are in English: German/French visitors see them only once their language has loaded. -->
    <script>
      try {
        var l = JSON.parse(localStorage.getItem('kv_lang') || 'null') || (navigator.language || 'en').slice(0, 2);
        if (l === 'de' || l === 'fr') document.documentElement.setAttribute('data-lang-pending', '');
      } catch (e) {}
      try {
        if (localStorage.getItem('kv_theme') !== 'dark') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <style>
      html[data-lang-pending] #root { visibility: hidden; }
      html { background: #0a0c0b; }
      html[data-theme='light'] { background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
