<!doctype html>
<html lang="en" data-first-load>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <meta name="apple-mobile-web-app-title" content="Maillot" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Capture your football shirt collection, see what it’s worth and show it anywhere." />
    <meta property="og:site_name" content="Maillot" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Maillot" />
    <meta property="og:description" content="Capture your football shirt collection, see what it’s worth and show it anywhere." />
    <meta property="og:image" content="/og/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Maillot — your football shirt collection, always with you" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Maillot — your football shirt collection, always with you</title>
    <!-- Prerendered pages are in English: German/French visitors see them only once their language has loaded. -->
    <script>
      try {
        var l = JSON.parse(localStorage.getItem('kv_lang') || 'null') || (navigator.language || 'en').slice(0, 2);
        if (l === 'de' || l === 'fr') document.documentElement.setAttribute('data-lang-pending', '');
      } catch (e) {}
      try {
        var th = localStorage.getItem('kv_theme');
        if (th === 'system') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (th !== 'dark') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <style>
      html[data-lang-pending] #root { visibility: hidden; }
      html { background: #0a0c0b; }
      html[data-theme='light'] { background: #ffffff; }
      /* Start screen: the logo until the app has drawn (and its language has loaded). */
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0a0c0b; color: #f2f4f1; font: 800 26px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
      html[data-theme='light'] #boot { background: #ffffff; color: #1d1d1f; }
      #boot img { width: 76px; height: 76px; border-radius: 19px; animation: boot-pulse 1.3s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(0.93); opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }
      #root:not(:empty) + #boot { display: none; }
      html[data-lang-pending] #root:not(:empty) + #boot { display: flex; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><img src="/icons/icon-192.png" alt="" width="76" height="76" /><span>Maillot</span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
