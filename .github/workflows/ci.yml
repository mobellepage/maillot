name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint · unit tests · build · smoke e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint -- --deny-warnings
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=smoke --project=smoke-mobile
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report
          retention-days: 7

  database:
    name: Migrations · database tests · backend e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      # Builds the whole database from supabase/migrations + seed.sql —
      # proves every migration applies cleanly from zero.
      - run: supabase start -x studio,imgproxy,inbucket,logflare,vector
      - run: supabase db lint --level error
      - name: Database tests (pgTAP)
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee pgtap.log || {
            # Logs need a GitHub login; annotations are public — surface failures there.
            grep -E "not ok|# +(Failed|Looks like)|ERROR|psql:" pgtap.log | head -40 | while IFS= read -r l; do echo "::error title=pgTAP::$l"; done
            exit 1
          }
      - name: Export local stack credentials
        run: |
          supabase status -o env > .supabase.env
          echo "E2E_SUPABASE_URL=$(grep '^API_URL=' .supabase.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .supabase.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - name: Backend e2e
        run: |
          set -o pipefail
          npx playwright test --project=backend --reporter=list 2>&1 | tee e2e.log || {
            # GitHub shows at most 10 annotations per step: one per failed test,
            # each carrying that test's error lines (newlines encoded as %0A).
            awk '/^  [0-9]+\) /{n++} n>0 && n<=10 && /^  [0-9]+\) |Error:|\((critical|serious|moderate|minor)\)| — |Not visible|Page:/{print n "\t" $0}' e2e.log \
              | awk -F'\t' '{a[$1]=a[$1] $2 "%0A"} END {for (k in a) print a[k]}' \
              | while IFS= read -r l; do echo "::error title=e2e::${l:0:4000}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-backend
          path: playwright-report
          retention-days: 7
      - run: supabase stop --no-backup
        if: always()
